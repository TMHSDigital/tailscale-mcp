version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # zod is no longer held back: the MCP SDK turns zod schemas into each
    # tool's input/output JSON Schema, and the mcp-tools.json snapshot test
    # fails on any change to that output, so a zod major is reviewed in its PR.
    ignore:
      # Hold the TypeScript 5.x line; 6.x is a transitional major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the oldest supported runtime (engines >=22, CI runs
      # 22 and 24) so code can't use APIs Node 22 lacks.
      - dependency-name: "@types/node"
        versions: [">=23"]

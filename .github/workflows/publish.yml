name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1; pin it so the job holding
      # id-token: write never runs an unreviewed npm release.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Gate: the exact tarball about to be published must install and serve
      # MCP over stdio.
      - run: npm run test:packed

      - name: Check if this version is already published
        id: pub
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$name@$ver is already on npm; skipping publish (idempotent re-dispatch)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Authenticates via npm trusted publishing (OIDC, id-token: write above);
      # no NPM_TOKEN secret. Provenance is attached automatically.
      - name: Publish to npm
        if: steps.pub.outputs.skip == 'false'
        run: npm publish --provenance --access public

      # List the release in the official MCP Registry. The registry checks that
      # the npm package's mcpName matches server.json and reads npm, so this
      # waits until npm serves the version. It runs whenever the registry lacks
      # this version, so a re-dispatch also repairs a release whose listing
      # failed. Auth is GitHub OIDC (id-token: write), which grants the
      # io.github.TMHSDigital/* namespace; no secret. mcp-publisher is pinned
      # and checksum-verified (the hash is from the release's checksums file).
      - name: Publish to the MCP Registry
        env:
          MCP_PUBLISHER_VERSION: "1.8.4"
          MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          name=$(jq -r .name server.json)
          enc=$(jq -rn --arg n "$name" '$n | @uri')
          if curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers/${enc}/versions" 2>/dev/null \
            | jq -e --arg v "$v" '[.servers[] | (.server // .) | select(.version == $v)] | length > 0' >/dev/null; then
            echo "$name $v is already in the MCP Registry."
            exit 0
          fi
          pkg=$(node -p "require('./package.json').name")
          for i in $(seq 1 30); do
            if [ "$(npm view "$pkg@$v" version --prefer-online 2>/dev/null)" = "$v" ]; then break; fi
            echo "Waiting for npm to serve $pkg@$v ($i/30)..."
            sleep 10
          done
          tarball=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$tarball" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${tarball}"
          echo "${MCP_PUBLISHER_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" mcp-publisher
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

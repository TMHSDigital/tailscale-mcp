name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1; pin it so the job holding
      # id-token: write never runs an unreviewed npm release.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Gate: the exact tarball about to be published must install and serve
      # MCP over stdio.
      - run: npm run test:packed

      - name: Check if this version is already published
        id: pub
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$name@$ver is already on npm; skipping publish (idempotent re-dispatch)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Authenticates via npm trusted publishing (OIDC, id-token: write above);
      # no NPM_TOKEN secret. Provenance is attached automatically.
      - name: Publish to npm
        if: steps.pub.outputs.skip == 'false'
        run: npm publish --provenance --access public

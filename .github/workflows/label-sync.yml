name: Label PRs

# pull_request_target runs in the base repository's context, so the token can
# label PRs from forks (under pull_request it is read-only there). This is safe
# only because the job never checks out or executes PR code: it reads the list
# of changed file names through the API and passes it via an env var, never
# interpolating it into the script.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Auto-label by path
    runs-on: ubuntu-latest
    steps:
      - name: Get changed files
        id: changed
        run: |
          FILES=$(gh pr diff "$PR" --name-only)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}

      - name: Apply labels
        run: |
          LABELS=""

          if echo "$FILES" | grep -q "^src/"; then
            LABELS="$LABELS code"
          fi

          if echo "$FILES" | grep -qE "^(test|tests)/|^src/__tests__/"; then
            LABELS="$LABELS tests"
          fi

          if echo "$FILES" | grep -q "^docs/"; then
            LABELS="$LABELS documentation"
          fi

          if echo "$FILES" | grep -q "^\.github/"; then
            LABELS="$LABELS ci"
          fi

          if [ -n "$LABELS" ]; then
            for label in $LABELS; do
              # Create the label only if it is missing; never reset an existing
              # label's color or description.
              gh label create "$label" --color "ededed" 2>/dev/null || true
              gh pr edit "$PR" --add-label "$label"
            done
            echo "Applied labels:$LABELS"
          else
            echo "No labels to apply"
          fi
        env:
          FILES: ${{ steps.changed.outputs.files }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
